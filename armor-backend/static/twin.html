<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ARMOR // 3D Digital Twin</title>
<style>
  :root {
    --bg: #070b11;
    --panel: rgba(13, 20, 28, 0.88);
    --panel-solid: #111a23;
    --line: rgba(111, 183, 255, 0.18);
    --line-strong: rgba(111, 183, 255, 0.34);
    --ink: #e8eff5;
    --muted: #a3b4c2;
    --faint: #71879a;
    --primary: #6fb7ff;
    --ok: #45d48a;
    --warn: #e3b341;
    --bad: #ff6b6b;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    --mono: 'JetBrains Mono', 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    background:
      radial-gradient(90% 80% at 50% 0%, #0d1722 0%, #070b11 58%, #050810 100%);
    color: var(--ink);
    font-family: var(--sans);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  #stage { position: absolute; inset: 0; }
  #stage canvas { display: block; }

  /* ── HUD ─────────────────────────────────────────────────────────────── */
  #hud {
    position: absolute;
    top: 14px;
    left: 14px;
    width: 284px;
    padding: 12px 14px 13px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--panel);
    backdrop-filter: blur(16px) saturate(120%);
    box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.04);
    font-family: var(--mono);
    z-index: 10;
  }

  #hud header {
    display: flex;
    align-items: center;
    gap: 9px;
    padding-bottom: 10px;
    border-bottom: 1px solid rgba(111, 183, 255, 0.14);
  }

  .mark {
    width: 22px;
    height: 22px;
    border-radius: 7px;
    border: 1px solid rgba(111, 183, 255, 0.45);
    background: linear-gradient(150deg, rgba(111, 183, 255, 0.32), rgba(111, 183, 255, 0.04));
    display: grid;
    place-items: center;
    flex: none;
  }
  .mark::after {
    content: "";
    width: 7px;
    height: 7px;
    border-radius: 2px;
    background: var(--primary);
    box-shadow: 0 0 10px rgba(111, 183, 255, 0.9);
  }

  .titles { flex: 1; min-width: 0; line-height: 1.15; }
  .titles strong { display: block; font-size: 12px; letter-spacing: 0.18em; font-weight: 700; }
  .titles span {
    display: block;
    font-size: 9px;
    letter-spacing: 0.06em;
    color: var(--faint);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .link {
    flex: none;
    font-size: 8.5px;
    letter-spacing: 0.14em;
    padding: 3px 7px;
    border-radius: 999px;
    border: 1px solid rgba(163, 180, 194, 0.3);
    color: var(--muted);
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .link::before {
    content: "";
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: currentColor;
    box-shadow: 0 0 8px currentColor;
  }
  .link[data-state="ok"] { color: var(--ok); border-color: rgba(69, 212, 138, 0.38); }
  .link[data-state="warn"] { color: var(--warn); border-color: rgba(227, 179, 65, 0.38); }
  .link[data-state="bad"] { color: var(--bad); border-color: rgba(255, 107, 107, 0.38); }

  .headline {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
    padding: 11px 0 9px;
    border-bottom: 1px solid rgba(111, 183, 255, 0.1);
  }
  .headline .k {
    font-size: 9px;
    letter-spacing: 0.16em;
    color: var(--faint);
  }
  .headline .v {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.03em;
    color: var(--ink);
  }
  .headline .v[data-state="ok"] { color: var(--ok); }
  .headline .v[data-state="warn"] { color: var(--warn); }
  .headline .v[data-state="bad"] { color: var(--bad); }

  .rows { display: grid; gap: 6px; padding: 10px 0 11px; }
  .row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    font-size: 11.5px;
  }
  .row .k {
    color: var(--faint);
    letter-spacing: 0.1em;
    font-size: 9px;
    text-transform: uppercase;
  }
  .row .v {
    color: var(--ink);
    font-weight: 600;
    letter-spacing: 0.01em;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .row .v small { color: var(--faint); font-weight: 400; margin-left: 2px; }
  .row .v[data-state="ok"] { color: var(--ok); }
  .row .v[data-state="warn"] { color: var(--warn); }
  .row .v[data-state="bad"] { color: var(--bad); }

  .anom { padding-top: 2px; }
  .anom .top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    font-size: 9px;
    letter-spacing: 0.12em;
    color: var(--faint);
    margin-bottom: 5px;
  }
  .anom .top b {
    font-size: 11.5px;
    letter-spacing: 0.02em;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }
  .track {
    height: 6px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.07);
    overflow: hidden;
    box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.5);
  }
  #anomFill {
    height: 100%;
    width: 0%;
    border-radius: 999px;
    background: linear-gradient(90deg, #45d48a, #8fe6b6);
    transition: width 0.35s ease, background 0.35s ease;
  }
  #contrib {
    margin-top: 6px;
    font-size: 9px;
    line-height: 1.4;
    color: var(--faint);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .traceWrap {
    margin-top: 10px;
    padding-top: 9px;
    border-top: 1px solid rgba(111, 183, 255, 0.12);
  }
  .traceWrap .cap {
    display: flex;
    justify-content: space-between;
    font-size: 8px;
    letter-spacing: 0.14em;
    color: var(--faint);
    margin-bottom: 4px;
  }
  #trace { width: 100%; height: 44px; display: block; }

  /* ── Status bar ──────────────────────────────────────────────────────── */
  #status {
    position: absolute;
    bottom: 14px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    max-width: min(70%, 620px);
    padding: 8px 18px;
    border-radius: 999px;
    border: 1px solid rgba(69, 212, 138, 0.4);
    background: rgba(9, 40, 27, 0.72);
    backdrop-filter: blur(12px);
    color: var(--ok);
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: color 0.2s ease, border-color 0.2s ease, background 0.2s ease;
  }
  #status[data-state="warn"] {
    color: var(--warn);
    border-color: rgba(227, 179, 65, 0.45);
    background: rgba(45, 33, 4, 0.72);
  }
  #status[data-state="bad"] {
    color: var(--bad);
    border-color: rgba(255, 107, 107, 0.5);
    background: rgba(48, 11, 11, 0.74);
    animation: alarm 1.1s ease-in-out infinite;
  }
  @keyframes alarm {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255, 107, 107, 0); }
    50% { box-shadow: 0 0 22px 0 rgba(255, 107, 107, 0.35); }
  }

  /* ── Camera presets ──────────────────────────────────────────────────── */
  #presets {
    position: absolute;
    right: 14px;
    bottom: 14px;
    z-index: 10;
    display: flex;
    gap: 6px;
    padding: 5px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--panel);
    backdrop-filter: blur(12px);
  }
  #presets button {
    all: unset;
    cursor: pointer;
    padding: 6px 10px;
    border-radius: 7px;
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 0.14em;
    color: var(--faint);
    border: 1px solid transparent;
    transition: color 0.16s ease, background 0.16s ease, border-color 0.16s ease;
  }
  #presets button:hover { color: var(--ink); }
  #presets button[aria-pressed="true"] {
    color: var(--primary);
    background: rgba(111, 183, 255, 0.12);
    border-color: rgba(111, 183, 255, 0.42);
  }
  #presets button:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }

  /* ── Boot / error ────────────────────────────────────────────────────── */
  #boot {
    position: absolute;
    inset: 0;
    z-index: 20;
    display: grid;
    place-content: center;
    gap: 10px;
    justify-items: center;
    background: radial-gradient(60% 60% at 50% 45%, #0d1722 0%, #070b11 70%);
    font-family: var(--mono);
    transition: opacity 0.45s ease;
  }
  #boot.gone { opacity: 0; pointer-events: none; }
  #boot .ring {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 2px solid rgba(111, 183, 255, 0.18);
    border-top-color: var(--primary);
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #boot .label { font-size: 10px; letter-spacing: 0.22em; color: var(--muted); }
  #boot .err {
    max-width: 320px;
    text-align: center;
    font-size: 10.5px;
    line-height: 1.6;
    letter-spacing: 0.04em;
    color: var(--warn);
  }

  @media (max-width: 760px), (max-height: 470px) {
    #hud { width: 232px; padding: 10px 12px; }
    .traceWrap { display: none; }
    #status { font-size: 9.5px; padding: 7px 14px; max-width: 62%; }
    #presets { top: 14px; bottom: auto; }
  }

  @media (prefers-reduced-motion: reduce) {
    #status[data-state="bad"] { animation: none; }
    #boot .ring { animation-duration: 3s; }
  }
</style>
</head>
<body>
<div id="stage"></div>

<section id="hud" aria-label="Digital twin telemetry">
  <header>
    <span class="mark"></span>
    <div class="titles">
      <strong>ARMOR</strong>
      <span id="dev">machino_node_01</span>
    </div>
    <span id="link" class="link" data-state="warn">LINK</span>
  </header>

  <div class="headline">
    <span class="k">MOTOR</span>
    <span class="v" id="motor" data-state="">--</span>
  </div>

  <div class="rows">
    <div class="row"><span class="k">Interlock</span><span class="v" id="interlock">--</span></div>
    <div class="row"><span class="k">Vicinity</span><span class="v" id="vicinity">--</span></div>
    <div class="row"><span class="k">PPE gate</span><span class="v" id="ppe">--</span></div>
    <div class="row"><span class="k">Vibration</span><span class="v" id="vib">--</span></div>
    <div class="row"><span class="k">Current</span><span class="v" id="current">--</span></div>
    <div class="row"><span class="k">Bus</span><span class="v" id="voltage">--</span></div>
    <div class="row"><span class="k">Temperature</span><span class="v" id="temp">--</span></div>
    <div class="row"><span class="k">Incidents</span><span class="v" id="incidents">--</span></div>
  </div>

  <div class="anom">
    <div class="top"><span>ANOMALY SCORE</span><b id="anomPct">--</b></div>
    <div class="track"><div id="anomFill"></div></div>
    <div id="contrib">waiting for the first telemetry window</div>
  </div>

  <div class="traceWrap">
    <div class="cap"><span>VIBRATION</span><span>TEMPERATURE</span></div>
    <canvas id="trace"></canvas>
  </div>
</section>

<div id="status" data-state="ok" aria-live="polite">SYSTEM NOMINAL</div>

<div id="presets" role="group" aria-label="Camera presets">
  <button type="button" data-preset="iso" aria-pressed="true">ISO</button>
  <button type="button" data-preset="front" aria-pressed="false">FRONT</button>
  <button type="button" data-preset="top" aria-pressed="false">TOP</button>
</div>

<div id="boot">
  <div class="ring"></div>
  <div class="label">INITIALISING DIGITAL TWIN</div>
  <div class="err" id="bootErr"></div>
</div>

<!-- Failsafe for a blocked CDN: the module below never runs if the import fails. -->
<script>
  window.__twinBooted = false;
  setTimeout(function () {
    if (!window.__twinBooted) {
      var el = document.getElementById('bootErr');
      if (el) {
        el.textContent =
          'Could not load the 3D engine from the CDN. Check the gateway internet connection, then reload.';
      }
    }
  }, 9000);
</script>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ──────────────────────────────────────────────────────────────────────────
   ARMOR digital twin

   Served by FastAPI at /twin and embedded in the Streamlit dashboard.
   Query params:
     device_id  machine node to follow          (default machino_node_01)
     host       ws gateway override, "ip:port"  (default: the page origin)
     demo       1 => scripted telemetry, no WS  (offline demos / screenshots)

   Design intent: the machine body is the primary readout. Colour, spin,
   brake, heat glow and beacon are all driven by /ws/live so an operator can
   read the cell from across the room; the HUD carries the exact numbers.
   ────────────────────────────────────────────────────────────────────────── */

const PALETTE = {
  bg: 0x070b11,
  steel: 0x2b3846,
  steelDark: 0x161f29,
  castIron: 0x1b242e,
  paint: 0x24435c,
  chrome: 0x9fb2c4,
  rubber: 0x0d141b,
  primary: 0x6fb7ff,
  ok: 0x45d48a,
  warn: 0xe3b341,
  bad: 0xff6b6b,
};

const params = new URLSearchParams(window.location.search);
const deviceId = params.get('device_id') || 'machino_node_01';
const hostOverride = params.get('host');
const demoMode = params.get('demo') === '1';
const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

document.getElementById('dev').textContent = deviceId;

/* ── Renderer / scene ───────────────────────────────────────────────────── */

const stage = document.getElementById('stage');
const scene = new THREE.Scene();
scene.background = new THREE.Color(PALETTE.bg);
scene.fog = new THREE.Fog(PALETTE.bg, 9, 19);

const camera = new THREE.PerspectiveCamera(
  46,
  Math.max(1, stage.clientWidth) / Math.max(1, stage.clientHeight),
  0.1,
  60,
);
camera.position.set(2.78, 2.0, 3.28);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(Math.max(1, stage.clientWidth), Math.max(1, stage.clientHeight));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.24;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.075;
controls.target.set(0.3, 0.62, 0);
controls.minDistance = 2.2;
controls.maxDistance = 11;
controls.minPolarAngle = 0.18;
controls.maxPolarAngle = Math.PI / 2 - 0.04;
controls.update();

/* ── Lighting ───────────────────────────────────────────────────────────── */

scene.add(new THREE.HemisphereLight(0x9fd0ff, 0x04070b, 0.72));

const key = new THREE.DirectionalLight(0xdfeaf5, 1.75);
key.position.set(3.6, 6.2, 3.4);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -4.5;
key.shadow.camera.right = 4.5;
key.shadow.camera.top = 4.5;
key.shadow.camera.bottom = -4.5;
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 22;
key.shadow.bias = -0.0006;
key.shadow.normalBias = 0.022;
scene.add(key);

const rim = new THREE.DirectionalLight(PALETTE.primary, 1.25);
rim.position.set(-4.5, 2.4, -3.6);
scene.add(rim);

const fill = new THREE.PointLight(0x8fc7ff, 17, 9, 2);
fill.position.set(-2.2, 1.7, 2.6);
scene.add(fill);

/* ── Ground ─────────────────────────────────────────────────────────────── */

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(7, 72),
  new THREE.MeshStandardMaterial({ color: 0x0a1119, roughness: 0.94, metalness: 0.08 }),
);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

const grid = new THREE.GridHelper(14, 28, 0x1f3a52, 0x122233);
grid.position.y = 0.002;
grid.material.transparent = true;
grid.material.opacity = 0.5;
scene.add(grid);

/* ── Materials ──────────────────────────────────────────────────────────── */

const matSteel = new THREE.MeshStandardMaterial({ color: PALETTE.steel, metalness: 0.78, roughness: 0.52 });
const matCast = new THREE.MeshStandardMaterial({ color: 0x2b3744, metalness: 0.48, roughness: 0.64 });
const matPaint = new THREE.MeshStandardMaterial({
  color: 0x33607f,
  metalness: 0.5,
  roughness: 0.44,
  emissive: new THREE.Color(0x000000),
});
const matChrome = new THREE.MeshStandardMaterial({ color: PALETTE.chrome, metalness: 0.95, roughness: 0.18 });
const matBrake = new THREE.MeshStandardMaterial({ color: 0x3b4b5c, metalness: 0.7, roughness: 0.4 });
const matBrass = new THREE.MeshStandardMaterial({ color: 0xc7a54a, metalness: 0.9, roughness: 0.32 });

/* ── Machine ────────────────────────────────────────────────────────────── */

const BODY_Y = 0.82;
const machine = new THREE.Group();      // bolted base — never moves
const rig = new THREE.Group();          // motor assembly — wobbles with vibration
machine.add(rig);
scene.add(machine);

function add(mesh, x, y, z, parent = rig) {
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}

// Base plate + hold-down bolts
add(new THREE.Mesh(new THREE.BoxGeometry(2.45, 0.14, 1.18), matSteel), 0.05, 0.07, 0, machine);
const boltGeo = new THREE.CylinderGeometry(0.045, 0.045, 0.05, 12);
[[-1.02, -0.42], [-1.02, 0.42], [1.12, -0.42], [1.12, 0.42], [0.05, -0.53], [0.05, 0.53]].forEach(([x, z]) => {
  add(new THREE.Mesh(boltGeo, matChrome), x, 0.16, z, machine);
});

// Mounting feet
const footGeo = new THREE.BoxGeometry(0.52, 0.26, 0.96);
[-0.46, 0.46].forEach((x) => add(new THREE.Mesh(footGeo, matCast), x, 0.27, 0, machine));

// Stator housing
const bodyMesh = add(
  new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.42, 1.36, 48), matPaint),
  0,
  BODY_Y,
  0,
);
bodyMesh.rotation.z = Math.PI / 2;

// Cooling fins — one instanced mesh keeps the draw calls down
const finCount = 26;
const finGeo = new THREE.CylinderGeometry(0.452, 0.452, 0.02, 44, 1, true);
const fins = new THREE.InstancedMesh(finGeo, matCast, finCount);
const finMatrix = new THREE.Matrix4();
const finQuat = new THREE.Quaternion().setFromEuler(new THREE.Euler(0, 0, Math.PI / 2));
const finScale = new THREE.Vector3(1, 1, 1);
for (let i = 0; i < finCount; i += 1) {
  const x = -0.62 + (i * 1.24) / (finCount - 1);
  finMatrix.compose(new THREE.Vector3(x, BODY_Y, 0), finQuat, finScale);
  fins.setMatrixAt(i, finMatrix);
}
fins.castShadow = true;
fins.receiveShadow = true;
rig.add(fins);

// End bells with bolt circles
[-0.71, 0.71].forEach((x) => {
  const bell = add(new THREE.Mesh(new THREE.CylinderGeometry(0.445, 0.445, 0.1, 48), matCast), x, BODY_Y, 0);
  bell.rotation.z = Math.PI / 2;
  for (let i = 0; i < 6; i += 1) {
    const a = (i / 6) * Math.PI * 2;
    const b = add(
      new THREE.Mesh(new THREE.CylinderGeometry(0.024, 0.024, 0.08, 10), matChrome),
      x + Math.sign(x) * 0.03,
      BODY_Y + Math.sin(a) * 0.34,
      Math.cos(a) * 0.34,
    );
    b.rotation.z = Math.PI / 2;
  }
});

// Terminal box + conduit
add(new THREE.Mesh(new THREE.BoxGeometry(0.36, 0.19, 0.28), matCast), 0.06, BODY_Y + 0.51, 0);
add(new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.03, 0.23), matSteel), 0.06, BODY_Y + 0.615, 0);
[-0.08, 0.2].forEach((x) => {
  add(new THREE.Mesh(new THREE.CylinderGeometry(0.032, 0.032, 0.16, 12), matSteel), x, BODY_Y + 0.7, 0.03);
});

// Nameplate
add(new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.09, 0.012), matBrass), -0.18, BODY_Y + 0.02, 0.425);

// Shaft, coupling, brake disc
const shaft = add(new THREE.Mesh(new THREE.CylinderGeometry(0.058, 0.058, 0.62, 24), matChrome), 1.02, BODY_Y, 0);
shaft.rotation.z = Math.PI / 2;

const coupling = add(new THREE.Mesh(new THREE.CylinderGeometry(0.115, 0.115, 0.16, 28), matSteel), 0.9, BODY_Y, 0);
coupling.rotation.z = Math.PI / 2;
[[0, 0.115], [0.1, -0.057], [-0.1, -0.057]].forEach(([x, y]) => {
  const grub = add(new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.018, 0.05, 8), matBrass), x, BODY_Y + y, 0);
  grub.rotation.x = Math.PI / 2;
});

const brakeDisc = add(new THREE.Mesh(new THREE.CylinderGeometry(0.205, 0.205, 0.026, 40), matChrome), 1.14, BODY_Y, 0);

  const size = 128;

  const gradient = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  gradient.addColorStop(0, 'rgba(255,255,255,1)');
  gradient.addColorStop(0.32, 'rgba(255,255,255,0.42)');

  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, size, size);
  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  return texture;
}

  interlock: false,
  breach: false,
  vicinity: false,
  ppe: false,
  workerId: null,
  anomaly: 0,
  isAnomaly: false,
  contributor: null,
  rms: null,
  temp: null,
  current: null,
  voltage: null,
  incidents: 0,
  lastAt: 0,
  connected: false,
};

const history = [];
const HISTORY_MAX = 96;

let spinSpeed = 0;
let spinTarget = 0;

/* ── HUD helpers ─────────────────────────────────────────────────────────── */

const $ = (id) => document.getElementById(id);

function setText(id, value) {
  const el = $(id);
  if (el && el.textContent !== value) el.textContent = value;
}

function setHtml(id, html) {
  const el = $(id);
  if (el && el.innerHTML !== html) el.innerHTML = html;
}

function setState(id, key) {
  const el = $(id);
  if (!el) return;
  if (key) el.dataset.state = key;
  else delete el.dataset.state;
}

function fmt(value, digits) {
  if (value === null || value === undefined || value === '') return '--';
  const n = Number(value);
  return Number.isFinite(n) ? n.toFixed(digits) : '--';
}

/* ── Snapshot handling ───────────────────────────────────────────────────── */

function applySnapshot(d) {
  const tel = d.latest_telemetry || {};

  state.motor = String(d.motor_state || 'UNKNOWN').toUpperCase();
  state.interlock = !!d.interlock_active;
  state.breach = !!d.proximity_breach_active;
  state.vicinity = !!d.vicinity_presence_active;
  state.ppe = String(d.vicinity_status || '').toUpperCase() === 'AUTHORIZED_OPERATOR_PPE_VERIFIED';
  state.workerId = d.active_worker_id || null;
  state.anomaly = Number(d.anomaly_percentage) || 0;
  state.isAnomaly = !!d.is_anomaly;
  state.contributor = d.top_contributor || null;
  state.rms = d.current_rms ?? tel.rms ?? null;
  state.temp = d.current_temp_c ?? tel.temperature_c ?? null;
  state.current = d.current_ma ?? tel.current_ma ?? null;
  state.voltage = tel.voltage_v ?? d.current_voltage_v ?? null;
  state.incidents = Array.isArray(d.open_incidents) ? d.open_incidents.length : 0;
  state.lastAt = Date.now();
  state.connected = true;

  const toNum = (v) => (v === null || v === undefined || v === '' ? NaN : Number(v));
  history.push({ rms: toNum(state.rms), temp: toNum(state.temp) });
  if (history.length > HISTORY_MAX) history.shift();

  paintHud();
  paintMachine();
  drawTrace();
}

function paintHud() {
  const engineHot = state.temp !== null && Number(state.temp) >= 45;
  const vibHigh = state.rms !== null && Number(state.rms) >= 0.15;

  setText('motor', state.motor);
  setState('motor', state.motor === 'RUNNING' ? 'ok' : state.motor === 'LOCKED' ? 'bad' : '');

  setText('interlock', state.interlock ? 'ENGAGED' : 'CLEAR');
  setState('interlock', state.interlock ? 'bad' : 'ok');

  if (!state.vicinity) {
    setText('vicinity', 'CLEAR');
    setState('vicinity', 'ok');
  } else {
    setText('vicinity', state.workerId ? String(state.workerId).slice(0, 18) : 'PERSON DETECTED');
    setState('vicinity', state.breach ? 'bad' : 'warn');
  }

  if (!state.vicinity) {
    setText('ppe', 'IDLE');
    setState('ppe', '');
  } else if (state.ppe) {
    setText('ppe', 'VERIFIED');
    setState('ppe', 'ok');
  } else {
    setText('ppe', state.breach ? 'VIOLATION' : 'CHECKING');
    setState('ppe', state.breach ? 'bad' : 'warn');
  }

  setHtml('vib', `${fmt(state.rms, 3)}<small>g</small>`);
  setState('vib', vibHigh ? (state.isAnomaly ? 'bad' : 'warn') : 'ok');

  setHtml('current', `${fmt(state.current, 0)}<small>mA</small>`);

  setHtml('voltage', `${fmt(state.voltage, 2)}<small>V</small>`);

  setHtml('temp', `${fmt(state.temp, 1)}<small>°C</small>`);
  setState('temp', engineHot ? 'warn' : 'ok');

  setText('incidents', state.incidents > 0 ? String(state.incidents) : '0');
  setState('incidents', state.incidents > 0 ? 'warn' : '');

  const pct = Math.max(0, Math.min(100, Number(state.anomaly) || 0));
  setText('anomPct', `${pct.toFixed(1)}%`);
  const fill = $('anomFill');
  fill.style.width = `${Math.max(2, pct)}%`;
  fill.style.background = state.isAnomaly
    ? 'linear-gradient(90deg, #ff6b6b, #ffb0b0)'
    : pct >= 35
      ? 'linear-gradient(90deg, #e3b341, #f3d68a)'
      : 'linear-gradient(90deg, #45d48a, #8fe6b6)';
  setText(
    'contrib',
    state.isAnomaly && state.contributor
      ? `Driven by ${state.contributor}`
      : state.contributor
        ? `Dominant signal: ${state.contributor}`
        : 'no dominant sensor — inside the calibrated band',
  );

  const statusKey = state.interlock
    ? 'bad'
    : state.breach
      ? 'bad'
      : state.anomaly >= 60
        ? 'warn'
        : state.vicinity
          ? state.ppe
            ? 'ok'
            : 'warn'
          : 'ok';

  const statusText = state.interlock
    ? 'EMERGENCY LOCKOUT · MOTOR BRAKED'
    : state.breach
      ? 'PROXIMITY BREACH · PPE UNVERIFIED'
      : state.isAnomaly
        ? `ANOMALY ${pct.toFixed(1)}%${state.contributor ? ` · ${String(state.contributor).toUpperCase()}` : ''}`
        : state.vicinity
          ? state.ppe
            ? 'WORKER IN VICINITY · PPE VERIFIED'
            : 'WORKER IN VICINITY · PPE CHECK RUNNING'
          : `SYSTEM NOMINAL · MOTOR ${state.motor}`;

  const statusEl = $('status');
  if (statusEl.textContent !== statusText) statusEl.textContent = statusText;
  statusEl.dataset.state = statusKey;
}

function paintMachine() {
  // Shaft/fan target speed follows state; actual speed is eased in animate().
  const loaded = Number(state.current) || 0;
  spinTarget =
    state.motor === 'RUNNING' && !state.interlock
      ? 3.4 + Math.min(1, loaded / 900) * 5.2
      : 0;

  // Ambient shell: green when running, cyan when idle, red when locked.
  const shell = state.interlock ? PALETTE.bad : state.motor === 'RUNNING' ? PALETTE.ok : PALETTE.primary;
  zoneMat.color.setHex(shell);
  zoneMat.opacity = state.interlock || state.breach ? 0.85 : state.vicinity ? 0.62 : 0.38;
  zoneFill.material.color.setHex(shell);
  zoneFill.material.opacity = state.interlock || state.breach ? 0.12 : 0.05;

  // Beacon colour follows the cell state: green powered, amber degraded, red alarm.
  const beaconTint = state.interlock || state.breach
    ? PALETTE.bad
    : state.isAnomaly || (state.vicinity && !state.ppe)
      ? PALETTE.warn
      : state.motor === 'RUNNING'
        ? PALETTE.ok
        : PALETTE.primary;
  beaconMat.emissive.setHex(beaconTint);
  beaconGlow.material.color.setHex(beaconTint);
  beaconLight.color.setHex(beaconTint);

  // Worker marker
  const showWorker = state.vicinity || !!state.workerId;
  worker.visible = showWorker;
  workerGlow.visible = showWorker;
  workerRing.visible = showWorker;
  if (showWorker) {
    const wc = state.ppe ? PALETTE.ok : state.breach ? PALETTE.bad : PALETTE.warn;
    workerMat.color.setHex(wc);
    workerMat.emissive.setHex(wc);
    workerVest.material.color.setHex(wc);
    workerVest.material.emissive.setHex(wc);
    workerGlow.material.color.setHex(wc);
    workerRing.material.color.setHex(wc);
  }
}

/* ── Trace sparklines ────────────────────────────────────────────────────── */

const traceCanvas = $('trace');

function drawSeries(ctx, values, w, h, top, colour) {
  const valid = values.filter((v) => Number.isFinite(v));
  if (valid.length < 2) {
    ctx.fillStyle = 'rgba(113,135,154,0.5)';
    ctx.font = '8px ui-monospace, monospace';
    ctx.fillText('awaiting samples', 2, top + h / 2 + 3);
    return;
  }

  const min = Math.min(...valid);
  const max = Math.max(...valid);
  const span = max - min || Math.max(Math.abs(max) * 0.1, 0.001);

  ctx.beginPath();
  values.forEach((value, i) => {
    const x = (i / Math.max(1, values.length - 1)) * (w - 2) + 1;
    const y = top + h - ((value - min) / span) * (h - 3) - 1.5;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  });
  ctx.strokeStyle = colour;
  ctx.lineWidth = 1.4;
  ctx.lineJoin = 'round';
  ctx.stroke();

  ctx.lineTo(w - 1, top + h);
  ctx.lineTo(1, top + h);
  ctx.closePath();
  ctx.fillStyle = colour.replace('rgb', 'rgba').replace(')', ',0.12)');
  ctx.fill();

  const last = values[values.length - 1];
  const ly = top + h - ((last - min) / span) * (h - 3) - 1.5;
  ctx.beginPath();
  ctx.arc(w - 2, ly, 2, 0, Math.PI * 2);
  ctx.fillStyle = colour;
  ctx.fill();
}

function drawTrace() {
  if (!traceCanvas) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.max(40, traceCanvas.clientWidth);
  const h = Math.max(20, traceCanvas.clientHeight);

  if (traceCanvas.width !== Math.round(w * dpr)) {
    traceCanvas.width = Math.round(w * dpr);
    traceCanvas.height = Math.round(h * dpr);
  }

  const ctx = traceCanvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);

  const half = h / 2 - 3;
  ctx.strokeStyle = 'rgba(111,183,255,0.12)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, h / 2);
  ctx.lineTo(w, h / 2);
  ctx.stroke();

  drawSeries(ctx, history.map((p) => p.rms), w, half, 0, 'rgb(111,183,255)');
  drawSeries(ctx, history.map((p) => p.temp), w, half, h / 2 + 2, 'rgb(227,179,65)');
}

/* ── Link badge / staleness ──────────────────────────────────────────────── */

function paintLink() {
  const age = state.lastAt ? (Date.now() - state.lastAt) / 1000 : Infinity;
  const link = $('link');
  const statusEl = $('status');

  if (demoMode) {
    link.textContent = 'DEMO';
    link.dataset.state = 'warn';
    return;
  }

  if (!state.connected || age > 6) {
    link.textContent = state.connected ? `STALE ${age.toFixed(0)}s` : 'OFFLINE';
    link.dataset.state = 'bad';
    statusEl.textContent = 'TELEMETRY LOST · RECONNECTING';
    statusEl.dataset.state = 'bad';
    return;
  }

  link.textContent = 'LIVE';
  link.dataset.state = 'ok';
}

setInterval(paintLink, 400);

  if (state.lastAt && (Date.now() - state.lastAt) / 1000 > 6) {
    state.connected = false;
    paintLink();
  }
}, 1000);

/* ── WebSocket ───────────────────────────────────────────────────────────── */

let socket = null;
let reconnectDelay = 800;
let reconnectTimer = null;

function wsUrl() {
  const proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
  const host = hostOverride || window.location.host || '127.0.0.1:8000';
  return `${proto}//${host}/ws/live?device_id=${encodeURIComponent(deviceId)}`;
}

function connect() {
  if (demoMode) return;
  if (reconnectTimer) {
    clearTimeout(reconnectTimer);
    reconnectTimer = null;
  }

  try {
    socket = new WebSocket(wsUrl());
  } catch (err) {
    scheduleReconnect();
    return;
  }

  socket.onopen = () => {
    reconnectDelay = 800;
    state.connected = true;
    paintLink();
  };

  socket.onmessage = (event) => {
    try {
      const data = JSON.parse(event.data);
      if (data && data.type === 'snapshot') applySnapshot(data);
    } catch (err) {
      /* ignore malformed frames */
    }
  };

  socket.onclose = () => {
    state.connected = false;
    paintLink();
    scheduleReconnect();
  };

  socket.onerror = () => {
    try {
      socket.close();
    } catch (err) {
      /* noop */
    }
  };
}

function scheduleReconnect() {
  if (reconnectTimer) return;
  reconnectTimer = setTimeout(() => {
    reconnectTimer = null;
    connect();
  }, reconnectDelay);
  reconnectDelay = Math.min(reconnectDelay * 1.7, 12000);
}

connect();

/* ── Demo telemetry (offline screenshots / stand-ins) ────────────────────── */

if (demoMode) {
  const phases = [
    { name: 'idle', ms: 4000 },
    { name: 'running', ms: 6000 },
    { name: 'anomaly', ms: 5000 },
    { name: 'vicinity', ms: 4000 },
    { name: 'breach', ms: 6000 },
  ];
  let phaseIndex = 0;
  let phaseStart = Date.now();
  let t = 0;

  setInterval(() => {
    const now = Date.now();
    const phase = phases[phaseIndex];
    if (now - phaseStart > phase.ms) {
      phaseIndex = (phaseIndex + 1) % phases.length;
      phaseStart = now;
    }
    t += 0.7;

    const running = phase.name !== 'idle' && phase.name !== 'breach';
    const breach = phase.name === 'breach';
    const anomaly = phase.name === 'anomaly';
    const vicinity = phase.name === 'vicinity' || breach;

    applySnapshot({
      type: 'snapshot',
      device_id: deviceId,
      motor_state: breach ? 'LOCKED' : running ? 'RUNNING' : 'IDLE',
      interlock_active: breach,
      proximity_breach_active: breach,
      vicinity_presence_active: vicinity,
      vicinity_status: breach
        ? 'UNAUTHORIZED_PERSON_IN_VICINITY'
        : vicinity
          ? 'AUTHORIZED_OPERATOR_PPE_VERIFIED'
          : 'NOMINAL',
      active_worker_id: vicinity ? 'badge-0x7f3a' : null,
      is_anomaly: anomaly,
      anomaly_percentage: anomaly ? 62 + Math.sin(t) * 9 : 3 + Math.sin(t * 0.7) * 2,
      anomaly_score: anomaly ? 0.31 : -0.11,
      top_contributor: anomaly ? 'Motor Current (INA219)' : 'Multi-Modal Sensor Array (Nominal)',
      current_rms: 0.03 + Math.random() * 0.012 + (anomaly ? 0.14 : 0),
      current_temp_c: 28.4 + Math.sin(t * 0.3) * 1.2 + (anomaly ? 9 : 0),
      current_ma: running ? 210 + Math.random() * 40 : 2,
      latest_telemetry: {
        rms: 0.03 + Math.random() * 0.012 + (anomaly ? 0.14 : 0),
        temperature_c: 28.4 + Math.sin(t * 0.3) * 1.2 + (anomaly ? 9 : 0),
        current_ma: running ? 210 + Math.random() * 40 : 2,
        voltage_v: 11.9 + Math.sin(t * 0.2) * 0.06,
      },
      open_incidents: breach ? [{ id: 'inc-1' }] : [],
      timestamp: new Date().toISOString(),
    });
  }, 700);
}

  });
}

document.querySelectorAll('#presets button').forEach((btn) => {
  btn.addEventListener('click', () => setPreset(btn.dataset.preset));
});

/* ── Animate ─────────────────────────────────────────────────────────────── */

const clock = new THREE.Clock();
let elapsed = 0;

function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;

  // Eased spindle speed so start/stop reads as inertia, not a switch.
  spinSpeed += (spinTarget - spinSpeed) * Math.min(1, dt * 3.2);
  if (spinSpeed > 0.02) spinner.rotation.x += spinSpeed * dt;

  // Vibration — amplitude tracks RMS; only the motor assembly moves, the
  // bolted base plate stays put.
  const rms = Number(state.rms);
  const amp = Number.isFinite(rms) ? Math.min(0.014, Math.max(0, (rms - 0.02) * 0.09)) : 0;
  const wobble = reducedMotion ? 0 : amp;
  rig.position.y = Math.sin(elapsed * 42) * wobble;
  rig.position.z = Math.cos(elapsed * 57) * wobble * 0.6;

  // Heat glow through the paint.
  const temp = Number(state.temp);
  const heat = Number.isFinite(temp) ? Math.max(0, Math.min(1, (temp - 38) / 38)) : 0;
  matPaint.emissive.setRGB(heat * 0.42, heat * 0.06, 0);

  // Brake caliper clamps the disc on lockout.
  const clampY = state.interlock ? 0.165 : 0.2;
  caliper.position.y += (BODY_Y + clampY - caliper.position.y) * Math.min(1, dt * 8);

  // Beacon strobe. Idle is a faint ember; lockout is a hard flash.
  const alarm = state.interlock || state.breach;
  const beaconOn = alarm
    ? Math.pow(Math.max(0, Math.sin(elapsed * 7)), 12)
    : state.isAnomaly
      ? 0.42 + Math.sin(elapsed * 2.4) * 0.16
      : 0.5 + Math.sin(elapsed * 1.2) * 0.08;
  beaconMat.emissiveIntensity = alarm ? 0.3 + beaconOn * 6 : beaconOn;
  beaconGlow.material.opacity = alarm ? 0.05 + beaconOn * 0.95 : beaconOn * 0.16;
  beaconLight.intensity = alarm ? beaconOn * 6 : beaconOn * 0.5;

  // Safety ring pulse.
  const alert = state.interlock || state.breach;
  const pulse = reducedMotion ? 1 : 1 + Math.sin(elapsed * 3.4) * (alert ? 0.035 : 0.008);
  zoneRing.scale.setScalar(pulse);
  ticks.rotation.y += dt * 0.12;

  if (worker.visible) {
    const orbit = elapsed * (state.breach ? 0.35 : 0.5);
    const radius = state.breach ? 1.35 : 1.62;
    const hop = reducedMotion ? 0 : Math.max(0, Math.sin(elapsed * 6)) * 0.02;
    worker.position.set(Math.cos(orbit) * radius, hop, Math.sin(orbit) * radius);
    workerGlow.position.set(worker.position.x, 0.85, worker.position.z);
    workerRing.position.set(worker.position.x, 0.02, worker.position.z);
    workerMat.emissiveIntensity = 0.25 + (Math.sin(elapsed * 5) * 0.5 + 0.5) * 0.35;
  }

  // Camera preset tween.
  if (cameraTween) {
    const k = Math.min(1, (performance.now() - cameraTween.started) / cameraTween.duration);
    const e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    camera.position.lerpVectors(cameraTween.fromPos, cameraTween.toPos, e);
    controls.target.lerpVectors(cameraTween.fromTarget, cameraTween.toTarget, e);
    if (k >= 1) {
      cameraTween = null;
      controls.enabled = true;
    }
  }

  controls.update();
  renderer.render(scene, camera);

  if (!bootDone) {
    bootDone = true;
    window.__twinBooted = true;
    const boot = $('boot');
    boot.classList.add('gone');
    setTimeout(() => boot.remove(), 600);
  }
}

animate();

/* ── Lifecycle ───────────────────────────────────────────────────────────── */

const resize = () => {
  const w = Math.max(1, stage.clientWidth);
  const h = Math.max(1, stage.clientHeight);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  drawTrace();
};

if (typeof ResizeObserver !== 'undefined') new ResizeObserver(resize).observe(stage);
window.addEventListener('resize', resize);

document.addEventListener('visibilitychange', () => {
  if (!document.hidden) clock.getDelta();
});

renderer.domElement.addEventListener('webglcontextlost', (event) => {
  event.preventDefault();
  const boot = $('boot');
  if (boot) {
    boot.classList.remove('gone');
    $('bootErr').textContent = 'GPU context lost. Reload the twin to rebuild the scene.';
  }
});

// Seed the scene: the machine idles in its neutral state until telemetry lands,
// and the status bar says so rather than claiming a nominal cell.
paintMachine();
paintLink();
drawTrace();
</script>
</body>
</html>
